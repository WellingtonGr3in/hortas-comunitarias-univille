# Sistema completo de Hortas Comunitárias em Docker.
#
#   docker compose up -d --build     sobe tudo (a primeira vez demora alguns minutos)
#   http://localhost:3000            sistema (login: admin@email.com / admin)
#   docker compose down              para tudo; o banco continua salvo no volume
#
# Segredos e senhas abaixo são só para uso local. Para trocar, crie um arquivo .env
# na raiz com JWT_SECRET, DB_PASSWORD e DB_ROOT_PASSWORD (veja docs/DOCKER.md).

services:
  mysql:
    image: mysql:8.4
    container_name: hortas_mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: hortas
      MYSQL_USER: hortas
      MYSQL_PASSWORD: ${DB_PASSWORD:-hortas_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: hortas_backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hortas
      DB_USER: hortas
      DB_PASS: ${DB_PASSWORD:-hortas_local}
      DB_CHARSET: utf8mb4
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-no-arquivo-env-da-raiz}
      API_VERSION: v1
    ports:
      - "8181:8181"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: hortas_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Opcional: docker compose --profile ferramentas up -d  →  http://localhost:8080
  phpmyadmin:
    image: phpmyadmin:5
    container_name: hortas_phpmyadmin
    profiles: ["ferramentas"]
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:

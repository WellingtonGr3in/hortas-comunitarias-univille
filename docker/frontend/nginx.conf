server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: repassa para o container do backend (mesma origem, sem CORS).
    location /api/ {
        proxy_pass http://backend:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Vue Router em modo history: qualquer rota do app cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
